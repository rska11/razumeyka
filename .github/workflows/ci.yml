name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "ci-dummy-nextauth-secret-for-build-only"
      NEXT_PUBLIC_SITE_URL: "https://znayton.ru"
      OPERATOR_NAME: "Кагиров Руслан Рашитович"
      OPERATOR_INN: "000000000000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'data/**', 'lib/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Install dependencies (respecting .npmrc & legacy-peer-deps)
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client & initialize CI SQLite database
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run tests (games)
        run: npm run test:games

      - name: Run tests (school-prep)
        run: npm run test:school-prep

      - name: Run tests (multiplication)
        run: npm run test:multiplication

      - name: Run tests (consent)
        run: npm run test:consent

      - name: Build production bundle
        run: npm run build
