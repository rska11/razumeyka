<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Что здесь лишнее?</title>
  <desc id="desc">Два синих круга, оранжевый круг и синий квадрат. Найдите два разных правила выбора лишней фигуры.</desc>
  <rect width="1440" height="810" rx="36" fill="#F6F2EB"/>
  <circle cx="1320" cy="70" r="180" fill="#E7EDF9"/>
  <circle cx="80" cy="800" r="200" fill="#E3EFE7"/>
  <g font-family="Arial, sans-serif" fill="#18334C">
    <text x="90" y="128" font-size="32" font-weight="700" letter-spacing="4" fill="#287A69">ИГРАЕМ ВМЕСТЕ</text>
    <text x="90" y="217" font-size="66" font-weight="700">Что здесь лишнее?</text>
    <text x="90" y="277" font-size="34" fill="#53677A">Выбери фигуру. Объясни своё правило.</text>
  </g>
  <g fill="#FFF" stroke="#E7E1D8" stroke-width="2">
    <rect x="90" y="343" width="285" height="285" rx="32"/>
    <rect x="415" y="343" width="285" height="285" rx="32"/>
    <rect x="740" y="343" width="285" height="285" rx="32"/>
    <rect x="1065" y="343" width="285" height="285" rx="32"/>
  </g>
  <circle cx="232.5" cy="485.5" r="85" fill="#4075D8"/>
  <circle cx="557.5" cy="485.5" r="85" fill="#4075D8"/>
  <circle cx="882.5" cy="485.5" r="85" fill="#EE974E"/>
  <rect x="1122.5" y="400.5" width="170" height="170" rx="6" fill="#4075D8"/>
  <text x="90" y="721" font-family="Arial, sans-serif" font-size="34" fill="#53677A">А теперь найди ещё один вариант ответа.</text>
</svg>
