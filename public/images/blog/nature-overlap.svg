<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">Перекрытие предметов</title><desc id="desc">Груша спереди закрывает часть чашки. Ручка справа видна. Скрытый контур не показан.</desc><rect width="1440" height="810" rx="36" fill="#f4f8f5"/><g font-family="Arial, sans-serif" fill="#163d38"><text x="80" y="100" font-size="48" font-weight="700">Что видно, а что скрыто?</text><text x="80" y="155" font-size="28">Груша стоит перед чашкой и закрывает часть её края.</text><rect x="65" y="210" width="830" height="400" rx="24" fill="#fff"/><path d="M 160 550 H 820" stroke="#a3bfb3" stroke-width="4"/><path d="M 420 310 L 440 485 Q 550 550 670 485 L690 310" fill="#dae8f3" stroke="#426b91" stroke-width="7"/><path d="M 685 340 C 810 300 810 475 673 468 L 678 430 C 750 430 751 350 684 377 Z" fill="#dae8f3" stroke="#426b91" stroke-width="7"/><ellipse cx="555" cy="310" rx="135" ry="38" fill="#f5f9fc" stroke="#426b91" stroke-width="7"/><path d="M 400 310 C 350 305 350 380 320 415 C 260 490 310 560 410 560 C 510 560 560 490 500 415 C 470 380 460 305 420 310 Z" fill="#f1d775" stroke="#9a7730" stroke-width="7"/><path d="M 410 312 Q 405 270 438 250" fill="none" stroke="#755532" stroke-width="9"/><text x="940" y="290" font-size="32" font-weight="700">Проверьте на натуре:</text><text x="940" y="355" font-size="28">1. Груша впереди.</text><text x="940" y="410" font-size="28">2. Ручка видна справа.</text><text x="940" y="465" font-size="28">3. Скрытый край</text><text x="973" y="505" font-size="28">не прорисован.</text><text x="80" y="680" font-size="30">Поменяйте предметы местами. Какие линии исчезли теперь?</text><text x="80" y="730" font-size="27">Это условная схема перекрытия, а не образец для копирования.</text></g></svg>