<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">Сравнение пропорций</title><desc id="desc">Прямоугольник 6 на 4 клетки и уменьшенная копия 3 на 2 клетки.</desc><rect width="1440" height="810" rx="36" fill="#f4f8f5"/><g font-family="Arial, sans-serif" fill="#163d38"><text x="80" y="100" font-size="48" font-weight="700">Сравниваем ширину и высоту</text><text x="80" y="155" font-size="28">На карточке: 6 × 4 клетки → уменьшаем вдвое → 3 × 2</text><rect x="150" y="260" width="360" height="240" fill="#c6e5da" stroke="#167d67" stroke-width="5"/><path d="M 210 260 v 240" stroke="#73b5a2" stroke-width="2"/><path d="M 270 260 v 240" stroke="#73b5a2" stroke-width="2"/><path d="M 330 260 v 240" stroke="#73b5a2" stroke-width="2"/><path d="M 390 260 v 240" stroke="#73b5a2" stroke-width="2"/><path d="M 450 260 v 240" stroke="#73b5a2" stroke-width="2"/><path d="M 150 320 h 360" stroke="#73b5a2" stroke-width="2"/><path d="M 150 380 h 360" stroke="#73b5a2" stroke-width="2"/><path d="M 150 440 h 360" stroke="#73b5a2" stroke-width="2"/><text x="150" y="550" font-size="30">Ширина 6, высота 4</text><rect x="950" y="360" width="180" height="120" fill="#c6e5da" stroke="#167d67" stroke-width="5"/><path d="M 1010 360 v 120" stroke="#73b5a2" stroke-width="2"/><path d="M 1070 360 v 120" stroke="#73b5a2" stroke-width="2"/><path d="M 950 420 h 180" stroke="#73b5a2" stroke-width="2"/><text x="950" y="530" font-size="30">Ширина 3, высота 2</text><path d="M 650 390 H 825 l -25 -20 m25 20 l-25 20" fill="none" stroke="#167d67" stroke-width="7"/><text x="80" y="670" font-size="30">Ширина первого больше его высоты на 2 клетки.</text><text x="80" y="720" font-size="28">У настоящего предмета сравните стороны заново.</text></g></svg>