<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">Пройди по клетчатому полю</title><desc id="desc">Старт: дом. Вправо к дереву, вниз к лодке, вправо к фонарю.</desc><rect width="1440" height="810" rx="32" fill="#f4f8ff"/><g transform="scale(1 .84375)" font-family="Arial, sans-serif" fill="#142b4a"><text x="80" y="95" font-size="46" font-weight="bold">Куда придёт фишка?</text><text x="80" y="155" font-size="32" >Старт — ДОМ. Один шаг — одна соседняя клетка.</text><rect x="280" y="245" width="285" height="155" rx="20" fill="#c9eee4" stroke="#9eb4d5" stroke-width="3"/><text x="422" y="335" font-size="30" text-anchor="middle" font-weight="bold">ДОМ</text><rect x="580" y="245" width="285" height="155" rx="20" fill="#e3eaff" stroke="#9eb4d5" stroke-width="3"/><text x="722" y="335" font-size="30" text-anchor="middle" font-weight="bold">ДЕРЕВО</text><rect x="880" y="245" width="285" height="155" rx="20" fill="#e3eaff" stroke="#9eb4d5" stroke-width="3"/><text x="1022" y="335" font-size="30" text-anchor="middle" font-weight="bold">МОСТ</text><rect x="280" y="415" width="285" height="155" rx="20" fill="#e3eaff" stroke="#9eb4d5" stroke-width="3"/><text x="422" y="505" font-size="30" text-anchor="middle" font-weight="bold">МЯЧ</text><rect x="580" y="415" width="285" height="155" rx="20" fill="#e3eaff" stroke="#9eb4d5" stroke-width="3"/><text x="722" y="505" font-size="30" text-anchor="middle" font-weight="bold">ЛОДКА</text><rect x="880" y="415" width="285" height="155" rx="20" fill="#ffe1b5" stroke="#9eb4d5" stroke-width="3"/><text x="1022" y="505" font-size="30" text-anchor="middle" font-weight="bold">ФОНАРЬ</text><rect x="280" y="585" width="285" height="155" rx="20" fill="#e3eaff" stroke="#9eb4d5" stroke-width="3"/><text x="422" y="675" font-size="30" text-anchor="middle" font-weight="bold">ЦВЕТОК</text><rect x="580" y="585" width="285" height="155" rx="20" fill="#e3eaff" stroke="#9eb4d5" stroke-width="3"/><text x="722" y="675" font-size="30" text-anchor="middle" font-weight="bold">КОТ</text><rect x="880" y="585" width="285" height="155" rx="20" fill="#e3eaff" stroke="#9eb4d5" stroke-width="3"/><text x="1022" y="675" font-size="30" text-anchor="middle" font-weight="bold">СКАМЕЙКА</text><text x="720" y="830" font-size="36" text-anchor="middle" font-weight="bold">ВПРАВО   →   ВНИЗ   →   ВПРАВО</text><text x="720" y="905" font-size="30" text-anchor="middle">Проверка: дом → дерево → лодка → фонарь.</text></g></svg>