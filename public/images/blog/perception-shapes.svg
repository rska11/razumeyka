<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">Найди такой же контур</title><desc id="desc">Образец с треугольной выемкой. А: тот же контур после поворота. Б: круглая выемка. В: без выемки.</desc><rect width="1440" height="810" rx="32" fill="#f4f8ff"/><g transform="scale(1 .84375)" font-family="Arial, sans-serif" fill="#142b4a"><text x="80" y="95" font-size="46" font-weight="bold">Какой контур совпадёт с образцом?</text><text x="80" y="155" font-size="30" >Бумагу можно поворачивать. Сравни границы фигуры.</text><rect x="80" y="200" width="1280" height="290" rx="28" fill="#e0f2ec"/><text x="130" y="260" font-size="27" font-weight="bold">ОБРАЗЕЦ</text><path d="M-120 -80 H-35 L0 -30 L35 -80 H120 V80 H-120 Z" transform="translate(720 350)" fill="#15a586" stroke="#103f47" stroke-width="6"/><text x="300" y="555" font-size="38" text-anchor="middle" font-weight="bold">А</text><g fill="#dbe6ff" stroke="#315cc8" stroke-width="6"><path d="M-120 -80 H-35 L0 -30 L35 -80 H120 V80 H-120 Z" transform="translate(300 680) rotate(90)"/></g><text x="720" y="555" font-size="38" text-anchor="middle" font-weight="bold">Б</text><g fill="#dbe6ff" stroke="#315cc8" stroke-width="6"><path d="M600 600 H685 A35 35 0 0 0 755 600 H840 V760 H600 Z"/></g><text x="1140" y="555" font-size="38" text-anchor="middle" font-weight="bold">В</text><g fill="#dbe6ff" stroke="#315cc8" stroke-width="6"><rect x="1020" y="600" width="240" height="160"/></g><text x="80" y="890" font-size="34" >Проверь наложением: одинаковый контур — А.</text></g></svg>