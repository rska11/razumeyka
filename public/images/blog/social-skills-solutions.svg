<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Одно место — два плана</title><desc id="desc">Один участник хочет реку, другой площадь. Два возможных плана: площадь у берега или площадь на мосту над рекой. Нужно проверить согласие обоих.</desc>
<rect width="1440" height="900" rx="40" fill="#f5f3fa"/>
<g font-family="Arial, sans-serif" fill="#173747">
<text x="75" y="105" font-size="62" font-weight="700">Одно место — два плана</text>
<text x="75" y="172" font-size="43">«Хочу реку» + «Хочу площадь»</text>
<g fill="white" stroke="#ded9eb" stroke-width="3"><rect x="65" y="220" width="635" height="440" rx="28"/><rect x="740" y="220" width="635" height="440" rx="28"/></g>
<text x="105" y="285" font-size="44" font-weight="700">А. Площадь у берега</text>
<text x="780" y="285" font-size="44" font-weight="700">Б. Площадь на мосту</text>
<rect x="115" y="330" width="535" height="280" rx="20" fill="#ebf3e7"/>
<path d="M120 530c150-100 330 90 525-20" stroke="#82c9e1" stroke-width="75" fill="none"/>
<rect x="280" y="358" width="200" height="105" rx="12" fill="#e6c596" stroke="#b38c59" stroke-width="5"/>
<path d="M330 359v104m50-104v104m50-104v104m-150-52h200" stroke="#c5a574" stroke-width="3"/>
<rect x="790" y="330" width="535" height="280" rx="20" fill="#ebf3e7"/>
<path d="M800 530c150-100 330 90 515-20" stroke="#82c9e1" stroke-width="75" fill="none"/>
<rect x="950" y="373" width="200" height="210" rx="10" fill="#e6c596" stroke="#b38c59" stroke-width="5"/>
<path d="M1000 374v208m50-208v208m50-208v208m-150-155h200m-200 53h200m-200 53h200" stroke="#c5a574" stroke-width="3"/>
<rect x="65" y="705" width="1310" height="135" rx="26" fill="#e0efe9"/>
<text x="105" y="760" font-size="44" font-weight="700">Проверяем: оба согласны попробовать?</text>
<text x="105" y="815" font-size="40">Можно изменить план или придумать свой.</text>
</g></svg>
