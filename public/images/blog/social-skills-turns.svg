<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Как договориться об очереди</title><desc id="desc">Один отпечаток, передача штампа, следующий ход. Уточняющий вопрос: после чего моя очередь? Ответ: после двух отпечатков.</desc>
<rect width="1440" height="900" rx="40" fill="#f2f8f5"/>
<g font-family="Arial, sans-serif" fill="#173747">
<text x="80" y="110" font-size="62" font-weight="700">Один штамп — общее правило</text>
<g fill="#fff" stroke="#cfe1db" stroke-width="3"><rect x="70" y="170" width="410" height="390" rx="28"/><rect x="515" y="170" width="410" height="390" rx="28"/><rect x="960" y="170" width="410" height="390" rx="28"/></g>
<g fill="#0a8a73" font-size="44" font-weight="700"><text x="105" y="235">1. Мой ход</text><text x="550" y="235">2. Передаю</text><text x="995" y="235">3. Твой ход</text></g>
<path d="m275 285 24 49 55 8-40 39 10 55-49-26-49 26 10-55-40-39 55-8z" fill="#f1ad40"/>
<path d="M605 366h225m-48-40 48 40-48 40" fill="none" stroke="#6c60bb" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
<path d="m1165 285 24 49 55 8-40 39 10 55-49-26-49 26 10-55-40-39 55-8z" fill="#6999d5"/>
<g font-size="40" text-anchor="middle"><text x="275" y="510">Один отпечаток</text><text x="720" y="510">Штамп другому</text><text x="1165" y="510">Один отпечаток</text></g>
<rect x="70" y="605" width="1300" height="225" rx="28" fill="#e4e0f4"/>
<text x="110" y="673" font-size="43" font-weight="700">Если слышишь «дам потом», уточни:</text>
<text x="110" y="738" font-size="48">«После чего моя очередь?»</text>
<text x="110" y="797" font-size="40">Пример ответа: «После двух отпечатков».</text>
</g></svg>
