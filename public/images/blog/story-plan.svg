<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">План понятного рассказа</title><desc id="desc">Четыре поля для значков: кто и где, что случилось, что сделал герой, чем закончилось.</desc><rect width="1440" height="810" rx="36" fill="#f0f6ff"/><g font-family="Arial, sans-serif" fill="#17335b"><text x="72" y="90" font-size="42" font-weight="700">Четыре вопроса для истории</text><text x="72" y="140" font-size="27">Нарисуй в каждом поле значок, затем расскажи.</text><rect x="60" y="185" width="645" height="255" rx="25" fill="white"/><circle cx="100" cy="229" r="23" fill="#246bfd"/><text x="92" y="239" fill="white" font-size="28">1</text><text x="140" y="240" font-size="31" font-weight="700">Кто и где?</text><text x="88" y="285" font-size="25">Назови героя и место</text><rect x="88" y="310" width="589" height="100" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 7"/><rect x="735" y="185" width="645" height="255" rx="25" fill="white"/><circle cx="775" cy="229" r="23" fill="#246bfd"/><text x="767" y="239" fill="white" font-size="28">2</text><text x="815" y="240" font-size="31" font-weight="700">Что случилось?</text><text x="763" y="285" font-size="25">С чего началась история</text><rect x="763" y="310" width="589" height="100" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 7"/><rect x="60" y="465" width="645" height="255" rx="25" fill="white"/><circle cx="100" cy="509" r="23" fill="#246bfd"/><text x="92" y="519" fill="white" font-size="28">3</text><text x="140" y="520" font-size="31" font-weight="700">Что сделал герой?</text><text x="88" y="565" font-size="25">Как он действовал</text><rect x="88" y="590" width="589" height="100" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 7"/><rect x="735" y="465" width="645" height="255" rx="25" fill="white"/><circle cx="775" cy="509" r="23" fill="#246bfd"/><text x="767" y="519" fill="white" font-size="28">4</text><text x="815" y="520" font-size="31" font-weight="700">Чем закончилось?</text><text x="763" y="565" font-size="25">Какой получился итог</text><rect x="763" y="590" width="589" height="100" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 7"/><text x="72" y="778" font-size="25">Подсказка для игры, а не обязательный шаблон каждого рассказа.</text></g></svg>