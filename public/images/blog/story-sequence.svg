<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">История по трём картинкам</title><desc id="desc">Посадка семечка, полив земли, появление ростка спустя время.</desc><rect width="1440" height="810" rx="36" fill="#f0f6ff"/><g font-family="Arial, sans-serif" fill="#17335b"><text x="72" y="90" font-size="42" font-weight="700">Как появилась новая история?</text><text x="72" y="140" font-size="27">Назови события и соедини их словами.</text><rect x="60" y="195" width="420" height="490" rx="28" fill="white"/><text x="88" y="250" font-size="31" font-weight="700">Сначала</text><path d="M170 480h200l-28 120H198Z" fill="#bd795d"/><ellipse cx="270" cy="480" rx="100" ry="22" fill="#654936"/><text x="88" y="650" font-size="29">Посадили семечко</text><ellipse cx="270" cy="385" rx="12" ry="20" fill="#8b6448" transform="rotate(25 270 385)"/><path d="M270 417v33m-12-13 12 13 12-13" fill="none" stroke="#246bfd" stroke-width="5"/><rect x="510" y="195" width="420" height="490" rx="28" fill="white"/><text x="538" y="250" font-size="31" font-weight="700">Потом</text><path d="M620 480h200l-28 120H648Z" fill="#bd795d"/><ellipse cx="720" cy="480" rx="100" ry="22" fill="#654936"/><text x="538" y="650" font-size="29">Полили землю</text><path d="M730 325h105v75H730Z M730 350l-70-25 50 65Z" fill="#5287ea"/><path d="M838 337q65-15 24 48" fill="none" stroke="#5287ea" stroke-width="14"/><path d="M676 370l-12 25m5 18-8 22m36-52-9 23" stroke="#38b4d7" stroke-width="8" stroke-linecap="round"/><rect x="960" y="195" width="420" height="490" rx="28" fill="white"/><text x="988" y="250" font-size="31" font-weight="700">Спустя время</text><path d="M1070 480h200l-28 120H1098Z" fill="#bd795d"/><ellipse cx="1170" cy="480" rx="100" ry="22" fill="#654936"/><text x="988" y="650" font-size="29">Появился росток</text><path d="M1170 478V365" stroke="#079a78" stroke-width="12" stroke-linecap="round"/><path d="M1170 435q-95 0-80-70 80 0 80 70m0-35q90 0 80-70-80 0-80 70" fill="#32b889"/><text x="72" y="753" font-size="27">Пример: посадили → полили → через некоторое время увидели росток.</text></g></svg>